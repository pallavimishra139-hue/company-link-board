<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company Link Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Company Link Board</h1>
    <div class="controls">
      <button id="addLinkBtn">➕ Add Link</button>
      <button id="addFolderBtn">📁 Add Folder</button>
    </div>
  </header>

  <main id="board"></main>

  <!-- Add Link Modal -->
  <div class="modal" id="linkModal" aria-hidden="true">
    <div class="modal-content">
      <h2>Add Link</h2>
      <form id="linkForm">
        <label>Title<br><input name="title" required></label>
        <label>URL<br><input name="url" type="url" required placeholder="https://..."></label>
        <label>Type<br>
          <select name="type">
            <option value="other">Other</option>
            <option value="google-drive">Google Drive</option>
            <option value="google-doc">Google Doc</option>
            <option value="google-sheet">Google Sheet</option>
            <option value="crm">CRM</option>
          </select>
        </label>
        <label>Folder<br>
          <select name="folder" id="folderSelect"></select>
        </label>
        <div class="modal-actions">
          <button type="submit">Save</button>
          <button type="button" id="cancelLink">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Simple inline prompts for adding folder -->
  <div id="folderPrompt" class="prompt" hidden>
    <input id="newFolderName" placeholder="New folder name">
    <button id="createFolder">Create</button>
    <button id="cancelFolder">Cancel</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
